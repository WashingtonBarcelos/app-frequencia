<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCFCFA">
<title>Relatório — Frequência</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<div class="folha">
  <header class="topo">
    <h1>Relatório de frequência</h1>
    <div class="sub" id="ultimo"></div>
  </header>
<nav class="menu">
  <a href="/chamada">Chamada</a>
  <a href="/relatorio" class="ativo">Relatório</a>
  <a href="/pessoas">Pessoas</a>
</nav>
  <div class="bloco duas naoimprime">
    <div>
      <label for="inicio">De</label>
      <input id="inicio" type="date">
    </div>
    <div>
      <label for="fim">Até</label>
      <input id="fim" type="date">
    </div>
  </div>

  <div class="bloco naoimprime" style="padding-top:0; display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px">
    <button id="filtrar" class="acao secundaria" type="button">Aplicar</button>
    <button id="limpar-periodo" class="acao secundaria" type="button">Tudo</button>
    <button id="pdf" class="acao" type="button">Salvar PDF</button>
  </div>

  <header class="so-impressao bloco">
    <h1>Relatório de frequência</h1>
    <p id="periodo-impresso"></p>
  </header>

  <div id="resumo" class="resumo"></div>

  <section class="secao">
    <h2>Precisam de contato</h2>
    <div id="status"></div>
  </section>

  <section class="secao">
    <h2>Frequência por pessoa</h2>
    <div id="frequencia"></div>
  </section>

  <section class="secao">
    <h2>Encontros sem chamada</h2>
    <div id="sem-chamada"></div>
  </section>

  <p class="bloco vazio" id="gerado"></p>
</div>
<script type="module" src="/js/relatorio.js"></script>
</body>
</html>
