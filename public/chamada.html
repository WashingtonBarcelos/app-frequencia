<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCFCFA">
<title>Chamada — Frequência</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<div class="folha">
  <header class="topo">
    <h1>Chamada</h1>
    <div class="sub">Preenchendo como <span id="usuario"></span></div>
  </header>
<nav class="menu">
  <a href="/chamada" class="ativo">Chamada</a>
  <a href="/relatorio">Relatório</a>
  <a href="/pessoas">Pessoas</a>
</nav>
  <div class="bloco duas">
    <div>
      <label for="data">Data</label>
      <input id="data" type="date">
    </div>
    <div>
      <label for="tipo">Encontro</label>
      <select id="tipo">
        <option value="domingo">Domingo</option>
        <option value="quarta">Quarta</option>
        <option value="outro">Outro</option>
      </select>
    </div>
  </div>

  <p id="aviso" class="aviso" hidden></p>

  <div class="abas">
    <button id="aba-membros" class="ativa" type="button">Membros</button>
    <button id="aba-visitantes" type="button">Visitantes</button>
  </div>

  <ul id="lista" class="lista"></ul>

  <div class="rodape">
    <span id="contador" class="contador"></span>
    <button id="salvar" class="acao" type="button">Salvar chamada</button>
  </div>
</div>
<script type="module" src="/js/chamada.js"></script>
</body>
</html>
