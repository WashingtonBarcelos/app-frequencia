<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCFCFA">
<title>Pessoas — Frequência</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<div class="folha">
  <header class="topo">
    <h1>Pessoas</h1>
    <div class="sub">Quem entra na chamada</div>
  </header>
<nav class="menu">
  <a href="/chamada">Chamada</a>
  <a href="/relatorio">Relatório</a>
  <a href="/pessoas" class="ativo">Pessoas</a>
</nav>
  <div class="bloco">
    <div class="campo">
      <label for="nome">Nome</label>
      <input id="nome" type="text" placeholder="Nome da pessoa">
    </div>

    <div class="campo">
      <label for="tipo">Tipo</label>
      <select id="tipo">
        <option value="membro">Membro</option>
        <option value="visitante">Visitante</option>
      </select>
    </div>

    <div class="campo" id="linha-convite" hidden>
      <label for="convidado_por">Convidado por</label>
      <select id="convidado_por"></select>
    </div>

    <button id="adicionar" class="acao" type="button">Adicionar à lista</button>
  </div>

  <p id="aviso" class="aviso" hidden></p>

  <div class="bloco" style="padding-top:0">
    <label for="busca">Buscar</label>
    <input id="busca" type="search" placeholder="Filtrar por nome" autocomplete="off">
  </div>

  <ul id="lista" class="lista"></ul>
</div>
<script type="module" src="/js/pessoas.js"></script>
</body>
</html>
