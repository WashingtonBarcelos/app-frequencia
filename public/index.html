<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FCFCFA">
  <title>Entrar — Frequência</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilo.css">
</head>

<body>
  <main class="pin-tela">
    <div class="pin-caixa">
      <h1>Frequência</h1>
      <p>Chamada dos encontros de domingo e quarta.</p>

      <div class="campo">
        <label for="responsavel">Quem está preenchendo</label>
        <select id="responsavel">Paulo</select>
        <select id="responsavel">Washington</select>
        <select id="responsavel">Ítalo</select>
        <select id="responsavel">Marlon</select>
      </div>

      <div class="campo">
        <label for="pin">PIN</label>
        <input id="pin" class="pin" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="&middot;&middot;&middot;&middot;">
      </div>

      <button id="entrar" class="acao" type="button" style="width:100%">Entrar</button>
      <p id="erro" class="erro"></p>
    </div>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>

</html>
